plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Loom registers the Fabric, Mojang and Maven Central repositories itself.

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Permissions API (LuckPerms-compatible), bundled jar-in-jar. Its Gradle metadata pins a
	// fabric-api BOM from 0.139.4; exclude it so the project's fabric-api stays authoritative.
	include(modImplementation("me.lucko:fabric-permissions-api:${project.permissions_api_version}") {
		exclude group: "net.fabricmc.fabric-api"
	})

	// Unit tests for the pure-logic classes (rules, brand normalisation, probe evaluation, config).
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Client game test: a real client joins an in-process dedicated server and the probe must resolve
// a vanilla key. Run with ./gradlew runClientGameTest (opens a game window).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "doorman-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

test {
	useJUnitPlatform()
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
	repositories {
	}
}
